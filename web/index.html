<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What I listened to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="headline">What I listened to</h1>

    <div class="people" id="people" role="group" aria-label="Whose listening to include" hidden></div>

    <div class="frames" id="frames" role="group" aria-label="Time frame">
      <button type="button" data-frame="1m">Last month</button>
      <button type="button" data-frame="3m">3 months</button>
      <button type="button" data-frame="6m">6 months</button>
      <button type="button" data-frame="1y">Last year</button>
      <button type="button" data-frame="2y">2 years</button>
      <button type="button" data-frame="5y">5 years</button>
      <button type="button" data-frame="all">All time</button>
      <select id="year" aria-label="Pick a calendar year"><option value="">Year…</option></select>
      <span class="custom">
        <input type="date" id="from" aria-label="From date">
        <span aria-hidden="true">to</span>
        <input type="date" id="to" aria-label="To date">
      </span>
    </div>
    <p class="frame-note" id="frame-note" hidden></p>

    <div class="decay">
      <label for="decay">Decay</label>
      <input type="range" id="decay" min="0" max="8" step="1" value="0" aria-describedby="decay-note">
      <output id="decay-val" for="decay">Off</output>
      <label class="check"><input type="checkbox" id="minplay" checked> Ignore plays under 30 seconds</label>
      <span class="note" id="decay-note"></span>
    </div>

    <section class="joint" id="joint" aria-label="Joint ranking" hidden>
      <div class="joint-row">
        <label>Formula
          <select id="formula">
            <option value="entropy">Shared listening (entropy)</option>
            <option value="logsum">Sum of logs (lenient)</option>
            <option value="harmonic">Harmonic mean (strict)</option>
          </select>
        </label>
        <label>Compare by
          <select id="by">
            <option value="plays">Plays</option>
            <option value="minutes">Minutes</option>
            <option value="score">Points (decayed minutes)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="common" checked> Only songs everyone played</label>
        <label class="check"><input type="checkbox" id="norm"> Adjust for how much each person listens</label>
      </div>
      <div class="weights" id="weights"></div>
      <p class="formula" id="formula-text"></p>
      <p class="match" id="match" hidden></p>
    </section>

    <div class="totals" id="totals" aria-live="polite"></div>
    <div class="split big" id="bigsplit"></div>
  </header>

  <details class="insights" id="insights">
    <summary>Insights <span>streaks, taste match, when and where you listen</span></summary>
    <div id="insights-body" class="insights-body"><p class="muted">Loading…</p></div>
  </details>

  <div class="viewbar">
    <div class="tabs" id="level" role="tablist" aria-label="Group by">
      <button type="button" role="tab" data-level="track">Songs</button>
      <button type="button" role="tab" data-level="artist">Artists</button>
      <button type="button" role="tab" data-level="album">Albums</button>
    </div>
    <label>Show
      <select id="view" aria-label="What to show"></select>
    </label>
    <label id="gap-wrap" hidden>not played for
      <select id="gap">
        <option value="91">3 months</option>
        <option value="182">6 months</option>
        <option value="365" selected>a year</option>
        <option value="730">2 years</option>
      </select>
    </label>
    <button type="button" class="ghost" id="copy">Copy top 50 as playlist</button>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <select id="sort" aria-label="Sort by"></select>
    <select id="min" aria-label="Minimum listening time">
      <option value="0">Any length</option>
      <option value="5">At least 5 min</option>
      <option value="20" selected>At least 20 min</option>
      <option value="60">At least 1 hour</option>
    </select>
    <select id="size" aria-label="Items per page">
      <option>24</option><option selected>48</option><option>96</option><option>192</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <ol class="grid" id="grid"></ol>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <img id="dlg-img" alt="">
    <div><h2 id="dlg-title"></h2><p id="dlg-sub"></p></div>
    <button type="button" class="close" id="dlg-close" aria-label="Close">×</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
